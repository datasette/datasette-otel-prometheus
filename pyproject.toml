[project]
name = "datasette-otel-prometheus"
version = "0.1.0a1"
description = "Serve Datasette's OpenTelemetry metrics on a dedicated port for Prometheus scraping"
readme = "README.md"
authors = [{name = "Alex Garcia"}]
license = "Apache-2.0"
classifiers=[
    "Framework :: Datasette"
]
requires-python = ">=3.10"
# Tested against opentelemetry-sdk 1.44.0, opentelemetry-exporter-prometheus
# 0.65b0, prometheus_client 0.26.0
dependencies = [
    "datasette>=1.0a41",
    "opentelemetry-sdk>=1.37",
    "opentelemetry-exporter-prometheus>=0.58b0",
    "prometheus-client",
    "pydantic>=2",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/datasette/datasette-otel-prometheus"
Changelog = "https://github.com/datasette/datasette-otel-prometheus/releases"
Issues = "https://github.com/datasette/datasette-otel-prometheus/issues"
CI = "https://github.com/datasette/datasette-otel-prometheus/actions"

[project.entry-points.datasette]
otel_prometheus = "datasette_otel_prometheus"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff>=0.16.8",
    "ty>=0.0.84",
]

[tool.setuptools.packages.find]
include = ["datasette_otel_prometheus*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.isort]
known-first-party = ["datasette_otel_prometheus"]
